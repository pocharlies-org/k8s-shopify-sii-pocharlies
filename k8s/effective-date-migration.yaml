# SKIRM-144: SiiSubmission.effectiveDate (devengo de cada R5; Skirmbooks la sincroniza
# para atribuir la R al trimestre del cambio). ADD COLUMN IF NOT EXISTS: idempotente.
apiVersion: batch/v1
kind: Job
metadata:
  name: effective-date-migration
  labels:
    app.kubernetes.io/component: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  # 900: sauvage (OVH) baja la imagen de harbor.lan en ~4 min; con 300 no llegaba a correr (14-10).
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: migrate
          image: harbor.lan.e-dani.com/homelab/shopify-sii-app:v1.15.0@sha256:561f7e98eb8115c008a3c1db0c7b8990b40174b3667c1ad76a92875c1490762b
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - npx
            - prisma
            - db
            - execute
            - --schema
            - prisma/schema.prisma
            - --file
            - prisma/migrations/20261014010000_add_sii_effective_date/migration.sql
          env:
            - { name: NODE_ENV, value: "production" }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: password }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connection_limit=2&pool_timeout=15&connect_timeout=10&application_name=sii-effective-date-migration" }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
