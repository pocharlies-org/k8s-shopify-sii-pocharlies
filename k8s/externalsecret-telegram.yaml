# SKIRM-72 (2026-10-02, security): el token del bot del informe SII deja de ser una
# copia a mano del Secret sii-secrets (creada 22-05, revocadas — su bot 8621739742
# @oppocharliesbot ya no existe). La fuente pasa a 1Password vía ExternalSecret:
# op://k8s-pocharlies/synapse-prod/telegram.bot_token = @synapse_skirmshop_bot
# (8531709820), que ya es miembro del grupo del informe (Skirmshop ES OP).
# mergePolicy Merge: solo gestiona esta clave y preserva las demás del Secret manual
# (SKIRM-70 seguirá migrando el resto). creationPolicy Orphan: borrar el ES no
# borra el Secret (evita el GC del ownerRef — ver k8s/eso del repo synapse).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-token
  labels:
    app.kubernetes.io/component: eso
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  target:
    name: sii-secrets
    creationPolicy: Orphan
    template:
      mergePolicy: Merge
  data:
    - secretKey: SII_REPORT_TELEGRAM_BOT_TOKEN
      remoteRef:
        # El provider onepasswordSDK de este cluster parsea key como
        # "<item>/<campo>" (vault del ClusterSecretStore); con key+property da
        # "secret reference has invalid format" (medido en logs del controller).
        key: synapse-prod/telegram.bot_token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
