# namePrefix turns "secrets" into "sii-secrets" (the Secret the deployment
# reads via envFrom). Until SC-2880 this Secret had no ExternalSecret: it was
# applied by hand after the Vault→1Password migration and had drifted from the
# canonical item. Same pattern as k8s-shopify-translations-pocharlies (SC-2841).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
spec:
  refreshInterval: 6h
  secretStoreRef: { name: onepassword, kind: ClusterSecretStore }
  target:
    name: sii-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: skirmshop-sii-secrets }
