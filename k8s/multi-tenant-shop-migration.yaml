# SC-1799 multi-tenant (columna `shop`): aplica la migracion 20261102000000_add_multi_tenant_shop
# sobre la base compartida `skirmshop` como hook PreSync, con la version anterior aun sirviendo.
# NO es `prisma migrate deploy`: la base skirmshop no tiene registrada en _prisma_migrations
# ninguna de las 5 migraciones de la imagen, y deploy intentaria aplicarlas todas (toca filas
# de otras apps). El script es idempotente y no escribe en _prisma_migrations: la constancia es
# el propio estado del esquema (igual que el patrón de vies-gate-migration.yaml).
# Imagen fijada por digest a v1.16.19 (SC-1694: desde v1.16.19 el script ya no fija ninguna tienda
# en el codigo — el backfill pide la variable SII_BACKFILL_SHOP y falla cerrado si no se le dice
# cual). Se fija la tienda historica `skirmshop-spain.myshopify.com` (la que el literal anterior
# backfillearia): con la migracion ya aplicada el script entra en modo already-applied/verify y no
# escribe nada; si el esquema regresara, el backfill iría al mismo inquilino que la migracion original.
# (v1.16.11 fallaba su propia verificacion y hacia rollback; la inspeccion de indices comillada
# esta desde v1.16.18.)
apiVersion: batch/v1
kind: Job
metadata:
  name: multi-tenant-shop-migration
  labels:
    app.kubernetes.io/component: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: migrate
          image: harbor.lan.e-dani.com/homelab/shopify-sii-app:v1.16.19@sha256:e4dae70f434eb0f8cc996fae6c97ada7ef6a61f084783193ef437bde34095bd6
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["tsx", "scripts/apply-multi-tenant-shop-migration.ts"]
          env:
            - { name: NODE_ENV, value: "production" }
            # SC-1694: el script exige la tienda destino del backfill (falla cerrado sin ella).
            # Tienda historica single_merchant; con la migracion aplicada no se usa (no escribe).
            - { name: SII_BACKFILL_SHOP, value: "skirmshop-spain.myshopify.com" }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: password }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connection_limit=2&pool_timeout=15&connect_timeout=10&application_name=sii-multi-tenant-migration" }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: multi-tenant-shop-migration-verify
  labels:
    app.kubernetes.io/component: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: verify
          image: harbor.lan.e-dani.com/homelab/shopify-sii-app:v1.16.19@sha256:e4dae70f434eb0f8cc996fae6c97ada7ef6a61f084783193ef437bde34095bd6
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - tsx
            - scripts/apply-multi-tenant-shop-migration.ts
            - --verify-only
          env:
            - { name: NODE_ENV, value: "production" }
            # SC-1694: el script exige la tienda destino del backfill (falla cerrado sin ella).
            # Tienda historica single_merchant; con la migracion aplicada no se usa (no escribe).
            - { name: SII_BACKFILL_SHOP, value: "skirmshop-spain.myshopify.com" }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shared-postgres-app, key: password }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connection_limit=2&pool_timeout=15&connect_timeout=10&application_name=sii-multi-tenant-migration-verify" }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
